query OwnerPublications($after: String, $ownerAddress: String!) {
  transactions(
    owners: [$ownerAddress]
    first: 100
    sort: HEIGHT_DESC
    tags: [{ name: "Entity-Type", values: ["publication"] }]
    after: $after
  ) {
    pageInfo {
      hasNextPage
    }
    edges {
      cursor
      node {
        ...TransactionCommon
      }
    }
  }
}

query WalletArDriveFees(
  $owner: String!
  $minHeight: Int!
  $bundledIn: [ID!]
  $after: String
) {
  transactions(
    owners: [$owner]
    bundledIn: $bundledIn
    block: { min: $minHeight }
    sort: HEIGHT_ASC
    first: 100
    after: $after
  ) {
    edges {
      node {
        fee {
          winston
        }
        block {
          height
        }
        bundledIn {
          id
        }
        tags {
          name
          value
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
    }
  }
}

name: 'Staging deploy'

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'

env:
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_NOTES: Staging - ${{ github.sha }}

jobs:
  pre-build:
    uses: ./.github/workflows/test.yml

  build-web:
    # Deliberately no `needs:`. This job shares nothing with the test job but a
    # checkout, so making it wait only added the tests' runtime to the wall
    # clock. The one thing that must not happen over a red test run is the
    # deploy, and that is now its own job below.
    runs-on: ubuntu-latest
    # The repository default is write. This job only reads the source.
    permissions:
      contents: read
    steps:
      # Checkout
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install script_runner
        run: flutter pub global activate script_runner

      - name: Build app
        run: |
          scr setup
          flutter config --enable-web
          flutter build web --dart-define=environment=staging --release --pwa-strategy=none --no-web-resources-cdn --source-maps --dart2js-optimization=O1

      - name: Upload the built web app
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy-web:
    # The only job that waits for the tests, because publishing the build is
    # the only step whose cost is not paid purely in CI minutes.
    needs: [pre-build, build-web]
    runs-on: ubuntu-latest
    # This deploy pushes the built app to the gh-pages branch, so it needs to
    # write the repository contents. It needs nothing else.
    permissions:
      contents: write
    # Two pushes in quick succession each ran a deploy, and whichever finished
    # last owned gh-pages: an older commit whose tests ran longer overwrote a
    # newer one. Publishing is now one run at a time, and only the commit dev
    # points at publishes (the check below). Never cancel: cancelling a
    # running or waiting deploy for dev's head, say because an older run was
    # re-run, would leave nothing to publish it.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    outputs:
      publish: ${{ steps.fresh.outputs.publish }}
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      # Deploys run in the order they were queued, not by commit, so a late or
      # re-run older dev run would still publish its old build over a newer
      # one. Publish only the commit dev points at now. Manual runs on other
      # refs are left alone: deploying one is their point.
      - name: Check this is still the dev head
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not publishing $GITHUB_SHA: dev is at $head, which deploys in its own run."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the built web app
        if: steps.fresh.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      # Deploy to github pages
      - if: steps.fresh.outputs.publish == 'true'
        uses: JamesIves/github-pages-deploy-action@4.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build/web
          clean: true
          single-commit: true

  deploy-arweave:
    # The staging channel for library pages (docs/LIBRARY_PAGES.md): the same
    # build, uploaded to Arweave gzipped the way production is, so library
    # mode can be tried on Arweave before a release. Upload only: there is no
    # ArNS name for staging yet, so the manifest ID goes in the job summary.
    # It runs after the GitHub Pages deploy so a failure here never holds
    # staging back, and only when that job published.
    needs: deploy-web
    if: needs.deploy-web.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: staging-arweave
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Download the built web app
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Leave source maps out
        run: find build/web -name '*.map' -delete

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Files already uploaded by an earlier run are not paid for again: the
      # cache holds their transaction IDs, and --incremental recovers any the
      # cache lost from this wallet's past uploads. Most pushes change only
      # main.dart.js. One cache entry per run, restored by prefix.
      - name: Restore the upload cache
        uses: actions/cache/restore@v4
        with:
          path: .ario-deploy
          key: ario-deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ario-deploy-staging-

      - name: Upload to Arweave
        id: upload
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          NO_COLOR: '1'
        run: |
          # Without a `shell:`, steps run without pipefail, and `tee` would
          # hide a failed upload.
          set -o pipefail
          # The CLI takes an Arweave JWK base64-encoded, as the action does.
          if [[ "$DEPLOY_KEY" =~ ^\{.*\}$ ]]; then
            DEPLOY_KEY=$(printf '%s' "$DEPLOY_KEY" | base64 -w0)
          fi
          export DEPLOY_KEY
          npx --yes @ar.io/deploy@2.1.1 upload --deploy-folder build/web \
            --compress gzip --incremental | tee upload.log
          id=$(sed -n 's/^Tx ID: \([A-Za-z0-9_-]\{43\}\)$/\1/p' upload.log | head -1)
          if [ -z "$id" ]; then
            echo "::error::The upload printed no Tx ID."
            exit 1
          fi
          echo "tx-id=$id" >> "$GITHUB_OUTPUT"
          echo "Staging on Arweave ($GITHUB_SHA): [$id](https://turbo-gateway.com/$id/)" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the upload cache
        if: always() && hashFiles('.ario-deploy/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .ario-deploy
          key: ario-deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}

      # A miss here does not undo the upload, so it is reported, not fatal.
      - name: Warm the gateways
        continue-on-error: true
        env:
          MANIFEST_ID: ${{ steps.upload.outputs.tx-id }}
        run: bash tool/warm_arweave_manifest.sh "$MANIFEST_ID"

  build-ios:
    # skipped for now
    if: false
    needs: pre-build
    runs-on: macos-latest
    steps:
      # Checkout
      - uses: actions/checkout@v3

      # Install Ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set FIREBASE_JSON env var
        run: echo "FIREBASE_JSON=$RUNNER_TEMP/firebase.json" >> $GITHUB_ENV

      - name: Save Firebase Service Account json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo -n "$FIREBASE_SERVICE_ACCOUNT_JSON" >> $FIREBASE_JSON

      - name: Install fastlane and Cocoapods
        working-directory: ./ios
        run: bundle install

      - name: Build iOS with fastlane
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.FASTLANE_SSH_KEY }}
          MATCH_PASSWORD: ${{ secrets.FASTLANE_MATCH_PASSWORD }}
        working-directory: ./ios
        run: bundle exec fastlane deploy type:staging

  build-android:
    # skipped for now
    if: false
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v3

      # Install Ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Install JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set FIREBASE_JSON env var
        run: echo "FIREBASE_JSON=$RUNNER_TEMP/firebase.json" >> $GITHUB_ENV

      - name: Save Firebase Service Account json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo -n "$FIREBASE_SERVICE_ACCOUNT_JSON" >> $FIREBASE_JSON

      - name: Set ANDROID_SIGNING_STORE_FILE env var
        run: echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Save Android Keystore file
        env:
          ANDROID_SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
        run: echo -n "$ANDROID_SIGNING_STORE" | base64 --decode >> $ANDROID_SIGNING_STORE_FILE

      - name: Install fastlane
        working-directory: ./android
        run: bundle install

      - name: Build Android with fastlane
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        working-directory: ./android
        run: bundle exec fastlane deploy type:staging

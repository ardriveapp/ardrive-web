name: 'PR build and deploy'

on:
  pull_request:
    branches-ignore:
      - gh-pages
      - master

# A new push to a pull request makes the run for the push before it pointless:
# stop it rather than let both hold runners.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_NOTES: ${{ github.event.pull_request.title }} - ${{ github.sha }}

jobs:
  pre-build:
    uses: ./.github/workflows/test.yml

  build-web:
    # Deliberately no `needs:`. This job shares nothing with the test job but a
    # checkout, so making it wait only added the tests' runtime to the wall
    # clock. The one thing that must not happen over a red test run is the
    # deploy, and that is now its own job below.
    runs-on: ubuntu-latest
    # The repository default is write. This job only reads the source.
    permissions:
      contents: read
    steps:
      # Checkout
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install script_runner
        run: flutter pub global activate script_runner

      # O2 is O1 plus minification, and nothing else: it keeps every type
      # check (O3 and O4 drop them). It cuts main.dart.js from about 29 MB to
      # 9 MB (4.3 MB to 2.6 MB gzipped). No code compares class names; see
      # docs/WEB_LOAD_TIME.md before adding any that does.
      - name: Build app
        run: |
          scr setup
          flutter config --enable-web
          flutter build web --dart-define=environment=development --release --pwa-strategy=none --no-web-resources-cdn --dart2js-optimization=O2

      # JS files cache invalidation
      - name: main.dart.js and service worker cache invalidation
        run: |
          sed -i 's/main.dart.js/main.dart.js?version='"$GITHUB_SHA"'/' build/web/index.html
          sed -i 's/flutter_service_worker.js/flutter_service_worker.js?version='"$GITHUB_SHA"'/' build/web/index.html

      - name: Upload the built web app
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy-web:
    # The only job that waits for the tests, because publishing a preview is
    # the only step whose cost is not paid purely in CI minutes.
    needs: [pre-build, build-web]
    runs-on: ubuntu-latest
    # Least privilege for the Firebase preview deploy: it reads the source, adds
    # the preview URL as a pull request comment, and reports a check run.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # `firebase.json` decides what is served and with which headers, so the
      # deploy needs the repo as well as the build output.
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Download the built web app
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      # Disribute to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_CI_SERVICE_ACCOUNT }}'
          # The site holds a limited number of preview channels, and with
          # several PRs a day a week's expiry filled it ("channel quota
          # reached"). A closed PR's channel is also deleted at once
          # (pr-closed.yaml); a redeploy renews the expiry.
          expires: 3d

  build-ios:
    # skipped for now
    if: false
    needs: pre-build
    runs-on: macos-latest
    steps:
      # Checkout
      - uses: actions/checkout@v3

      # Install Ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set FIREBASE_JSON env var
        run: echo "FIREBASE_JSON=$RUNNER_TEMP/firebase.json" >> $GITHUB_ENV

      - name: Save Firebase Service Account json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo -n "$FIREBASE_SERVICE_ACCOUNT_JSON" >> $FIREBASE_JSON

      - name: Install fastlane and Cocoapods
        working-directory: ./ios
        run: bundle install

      - name: Build iOS with fastlane
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.FASTLANE_SSH_KEY }}
          MATCH_PASSWORD: ${{ secrets.FASTLANE_MATCH_PASSWORD }}
        working-directory: ./ios
        run: bundle exec fastlane deploy type:branch


  build-android:
    # skipped for now
    if: false
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v3

      # Install Ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Install JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@v1

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set FIREBASE_JSON env var
        run: echo "FIREBASE_JSON=$RUNNER_TEMP/firebase.json" >> $GITHUB_ENV

      - name: Save Firebase Service Account json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo -n "$FIREBASE_SERVICE_ACCOUNT_JSON" >> $FIREBASE_JSON

      - name: Set ANDROID_SIGNING_STORE_FILE env var
        run: echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Save Android Keystore file
        env:
          ANDROID_SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
        run: echo -n "$ANDROID_SIGNING_STORE" | base64 --decode >> $ANDROID_SIGNING_STORE_FILE

      - name: Install fastlane
        working-directory: ./android
        run: bundle install

      - name: Build Android with fastlane
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        working-directory: ./android
        run: bundle exec fastlane deploy type:branch


name: 'Staging build to Arweave'

# Uploads a staging build of the chosen branch to Arweave, gzipped, for
# trying publication mode on Arweave before a release (docs/PUBLICATIONS.md).
# Manual only: every run is paid for by the deploy wallet, and pushes to dev
# deploy staging.ardrive.io through staging.yaml, not here. There is no ArNS
# name; the manifest ID is in the job summary.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: staging-arweave
      cancel-in-progress: false
    # Every action is pinned by commit: this job holds DEPLOY_KEY, and any
    # step before the upload can change what it uploads.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Set Flutter version from fvm
      - uses: kuhnroyal/flutter-fvm-config-action@6ffa30473b346f7d7c63cf9e03e6a886f940a72b # v1.2.0

      # Install Flutter
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install script_runner
        run: flutter pub global activate script_runner

      # The staging build, without source maps: on Arweave they would only
      # add 11 MB to pay for.
      - name: Build app
        run: |
          scr setup
          flutter config --enable-web
          flutter build web --dart-define=environment=staging --release --pwa-strategy=none --no-web-resources-cdn --dart2js-optimization=O1

      # Flutter's fallback fonts, which a publication loads from its own
      # host rather than fonts.gstatic.com (the fetch rewrite in
      # web/index.html). About 81 MB, checked against tool/fallback_fonts.sha256;
      # the files only change with Flutter, so incremental deploys upload them
      # once per Flutter version.
      - name: Add the fallback fonts
        run: bash tool/fetch_fallback_fonts.sh

      # An exact, patched Node: '22' alone can resolve to an older 22.x the
      # runner image already has, and the CLI decodes brotli responses
      # (CVE-2026-111497, fixed in 22.23.4 and 24.22.1).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'

      # The action has no upload-only mode (it always updates an ArNS name),
      # so this runs the CLI at an exact version. --incremental reuses files
      # this wallet already uploaded, so a run pays mostly for main.dart.js.
      - name: Upload to Arweave
        id: upload
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          NO_COLOR: '1'
        run: |
          # Without a `shell:`, steps run without pipefail, and `tee` would
          # hide a failed upload.
          set -o pipefail
          # The CLI takes an Arweave JWK base64-encoded, as the action does.
          if [[ "$DEPLOY_KEY" =~ ^\{.*\}$ ]]; then
            DEPLOY_KEY=$(printf '%s' "$DEPLOY_KEY" | base64 -w0)
          fi
          export DEPLOY_KEY
          npx --yes @ar.io/deploy@2.1.2 upload --deploy-folder build/web \
            --compress gzip --incremental | tee upload.log
          id=$(sed -n 's/^Tx ID: \([A-Za-z0-9_-]\{43\}\)$/\1/p' upload.log | head -1)
          if [ -z "$id" ]; then
            echo "::error::The upload printed no Tx ID."
            exit 1
          fi
          echo "tx-id=$id" >> "$GITHUB_OUTPUT"
          echo "Staging on Arweave ($GITHUB_REF_NAME, $GITHUB_SHA): [$id](https://turbo-gateway.com/$id/)" >> "$GITHUB_STEP_SUMMARY"

      # A miss here does not undo the upload, so it is reported, not fatal.
      - name: Warm the gateways
        continue-on-error: true
        env:
          MANIFEST_ID: ${{ steps.upload.outputs.tx-id }}
        run: bash tool/warm_arweave_manifest.sh "$MANIFEST_ID"
